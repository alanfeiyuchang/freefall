name: Freefall
options:
  bundleIdPrefix: com.feiyuchang
  createIntermediateGroups: true
  deploymentTarget:
    visionOS: "27.0"
  developmentLanguage: en

# 工程文件由 `xcodegen generate` 从这里生成，Freefall.xcodeproj 在 .gitignore 里。
# 要改设置就改这个文件，别在 Xcode 里改。

settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.feiyuchang.freefall
    DEVELOPMENT_TEAM: 5V3HM8L9GT
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Freefall:
    type: application
    platform: visionOS
    sources:
      - path: Freefall
    settings:
      base:
        PRODUCT_NAME: Freefall
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Freefall
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationPreferredDefaultSceneSessionRole: UIWindowSceneSessionRoleApplication
        INFOPLIST_KEY_NSWorldSensingUsageDescription: 用来跟踪你头部的位置和朝向。
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: 性能测试时把测量结果发回开发用的 Mac。
        INFOPLIST_KEY_NSHandsTrackingUsageDescription: 用来让你用手抓扶杆、拉开伞拉手和操纵环，并把高度表戴在你的手腕上。
        # 手套的法线贴图、材质贴图按原始数值读，不让 Xcode 把 PNG 改写成 iOS 专用格式
        COMPRESS_PNG_FILES: NO
        STRIP_PNG_TEXT: NO
